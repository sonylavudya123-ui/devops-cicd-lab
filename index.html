<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitLab CI/CD Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>GitLab CI/CD Automation</h1>
        <p>Welcome to my automated deployment project!</p>

        <h2>Pipeline Stages</h2>

        <div class="stages">
            <div>1. Build</div>
            <div>2. Test</div>
            <div>3. Deploy</div>
        </div>

        <p id="status">Website is ready.</p>

        <button onclick="showMessage()">Test Website</button>
    </main>

    <script>
        function showMessage() {
            document.getElementById("status").textContent =
                "Website is working successfully!";
        }
    </script>
</body>
</html>
