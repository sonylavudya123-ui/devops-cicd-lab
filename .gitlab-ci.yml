stages:
  - build
  - test
  - deploy

build_website:
  stage: build
  script:
    - |
      Write-Host "Building website"
      New-Item -ItemType Directory -Force -Path public
      Copy-Item index.html, style.css -Destination public/
      if (!(Test-Path "public/index.html")) { throw "HTML file missing" }
      Write-Host "Build completed successfully"
  artifacts:
    paths:
      - public/

test_website:
  stage: test
  script:
    - |
      Write-Host "Testing website files"
      if (!(Test-Path "public/index.html")) { throw "HTML file missing" }
      if (!(Test-Path "public/style.css")) { throw "CSS file missing" }
      Write-Host "All tests passed"

deploy_website:
  stage: deploy
  script:
    - |
      Write-Host "Deployment stage completed"
      Write-Host "Website files are ready in the public folder"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'